<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wordly Dictionary</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Wordly Dictionary</h1>

    <p>Search for a word to see the meaning.</p>


    <form id="search-form">

      <input
        type="text"
        id="word-input"
        placeholder="Enter a word"
        required
      >

      <button type="submit">
        Search
      </button>

    </form>


    <p id="message"></p>


    <div id="result">

      <h2 id="word"></h2>

      <p id="pronunciation"></p>

      <p id="part-of-speech"></p>

      <p id="definition"></p>

      <p id="example"></p>

      <p id="synonyms"></p>

      <audio
        id="audio"
        controls
      ></audio>

      <br>

      <button id="save-button">
        Save Favorite
      </button>

    </div>


    <div class="favorite-section">

      <h2>My Favorite Words</h2>

      <ul id="favorite-list"></ul>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
